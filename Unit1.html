<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de questões · Licitação, Contratos e Convênios</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 950px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -8px rgba(0, 20, 50, 0.2);
      padding: 2rem 2rem 2.5rem;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0a2942;
      letter-spacing: -0.02em;
      border-left: 7px solid #1e6f9f;
      padding-left: 1.2rem;
      margin-bottom: 0.6rem;
      line-height: 1.3;
    }

    .subtitle {
      color: #2c4a6e;
      font-size: 1rem;
      margin-bottom: 2rem;
      padding-left: 2rem;
      border-bottom: 1px solid #d9e2ec;
      padding-bottom: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .subtitle span {
      background: #e6f0f9;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-weight: 500;
      color: #0a3d62;
      font-size: 0.9rem;
    }

    /* NOVO: seletor de questões */
    .selector-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .selector-wrapper label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #164465;
    }

    #questionSelector {
      font-size: 0.85rem;
      font-weight: 500;
      color: #0a3d62;
      background: #e6f0f9;
      border: 1.5px solid #b3cee2;
      border-radius: 40px;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
      max-width: 260px;
      transition: 0.15s;
    }

    #questionSelector:hover {
      background: #d0e2f0;
      border-color: #6d9ec9;
    }

    #questionSelector:focus {
      outline: none;
      border-color: #1e6f9f;
      box-shadow: 0 0 0 2px rgba(30, 111, 159, 0.2);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #d0dfec;
      border-radius: 20px;
      margin: 1.2rem 0 0.8rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1e6f9f, #2895c9);
      width: 0%;
      border-radius: 20px;
      transition: width 0.2s ease;
    }

    .counter {
      text-align: right;
      font-size: 0.85rem;
      font-weight: 500;
      color: #3e5f7e;
      margin-bottom: 1.8rem;
    }

    .question-card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 1.5rem 1.8rem 1.8rem;
      box-shadow: 0 6px 18px rgba(0, 20, 30, 0.06);
      border: 1px solid #dde9f2;
      margin-bottom: 1.5rem;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0c314b;
      line-height: 1.5;
      margin-bottom: 1.2rem;
      background: #f7fafd;
      padding: 1rem 1.2rem;
      border-radius: 1rem;
      border-left: 5px solid #1e6f9f;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: #f8fbfe;
      border: 1.5px solid #cfdfeb;
      border-radius: 60px;
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 1rem;
      color: #1b3b55;
      font-weight: 500;
      line-height: 1.4;
    }

    .option:hover {
      background: #e5f0fa;
      border-color: #6d9ec9;
    }

    .option.selected {
      background: #d9ebf9;
      border-color: #1e6f9f;
      box-shadow: 0 0 0 2px rgba(30, 111, 159, 0.2);
    }

    .option.correct {
      background: #d4edda;
      border-color: #1e7b4b;
      color: #0a3d2a;
      font-weight: 600;
    }

    .option.incorrect {
      background: #f8d7da;
      border-color: #b02a37;
      color: #661a24;
      font-weight: 600;
    }

    .option input[type="radio"] {
      appearance: none;
      width: 1.2rem;
      height: 1.2rem;
      border: 2px solid #7c9eb9;
      border-radius: 50%;
      display: inline-grid;
      place-content: center;
      margin: 0;
      flex-shrink: 0;
      transition: 0.1s;
    }

    .option input[type="radio"]:checked {
      border-color: #1e6f9f;
      background: #1e6f9f;
      box-shadow: inset 0 0 0 3px white;
    }

    .option input[type="radio"]:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .feedback {
      font-size: 1rem;
      font-weight: 500;
      padding: 0.9rem 1.2rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      background: #f2f7fc;
      border-left: 5px solid #1e6f9f;
      color: #0a2942;
    }

    .feedback.correct-fb {
      background: #e2f3e6;
      border-left-color: #1e7b4b;
      color: #0a3d2a;
    }

    .feedback.incorrect-fb {
      background: #fce8ea;
      border-left-color: #b02a37;
      color: #661a24;
    }

    .feedback-icon {
      font-size: 1.3rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
    }

    .btn {
      background: #1e6f9f;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(30, 111, 159, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      letter-spacing: 0.3px;
    }

    .btn:hover:not(:disabled) {
      background: #155a84;
      box-shadow: 0 6px 14px rgba(30, 111, 159, 0.4);
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #a2bdd3;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-secondary {
      background: #e1ecf5;
      color: #1e4b6b;
      box-shadow: none;
      border: 1px solid #b3cee2;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #d0e2f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .btn-reset {
      background: #ffffff;
      color: #1e4b6b;
      border: 1.5px solid #b3cee2;
      box-shadow: none;
    }

    .btn-reset:hover {
      background: #f0f7fd;
    }

    .btn-group {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .stats {
      font-size: 0.9rem;
      background: #eaf2f9;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      color: #164465;
    }

    @media (max-width: 550px) {
      .container {
        padding: 1.5rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        padding-left: 0.8rem;
      }
      .subtitle {
        padding-left: 0.5rem;
        font-size: 0.9rem;
      }
      .option {
        font-size: 0.9rem;
        padding: 0.7rem 1rem;
      }
      .actions {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        justify-content: center;
      }
      .btn {
        padding: 0.7rem 1.2rem;
        font-size: 0.9rem;
      }
      #questionSelector {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Licitação, Contratos e Convênios</h1>
    <div class="subtitle">
      <span>200 questões · múltipla escolha</span>
      <div class="selector-wrapper">
        <label for="questionSelector">Ir para questão:</label>
        <select id="questionSelector"></select>
        <span id="statsDisplay" class="stats">✅ 0 acertos · 0 erros</span>
      </div>
    </div>

    <!-- barra de progresso -->
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>
    <div class="counter" id="counterText">Questão 1 de 200</div>

    <!-- card da questão -->
    <div class="question-card">
      <div class="question-text" id="questionText">Carregando questão...</div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedbackArea">
        <span class="feedback-icon">📌</span>
        <span id="feedbackMessage">Escolha uma alternativa e clique em “Confirmar”.</span>
      </div>
      <div class="actions">
        <div class="btn-group">
          <button class="btn" id="confirmBtn" disabled>✅ Confirmar resposta</button>
          <button class="btn btn-secondary" id="nextBtn" disabled>➡️ Próxima</button>
          <button class="btn btn-secondary" id="prevBtn" disabled>⬅️ Anterior</button>
        </div>
        <button class="btn btn-reset" id="resetBtn">🔄 Reiniciar banco</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ----------------------------------------------------------------
      // BANCO DE QUESTÕES (200) com 4 alternativas cada
      // ----------------------------------------------------------------
      const questions = [
        // Capítulo 1 - Licitação
        { q: "Qual é a previsão constitucional para a licitação e qual lei a regulamentava originalmente?",
          options: [
            "Art. 37, XXI, CF/88; Lei 8.666/93.",
            "Art. 5º, LIV, CF/88; Lei 8.112/90.",
            "Art. 22, XXVII, CF/88; Lei 14.133/21.",
            "Art. 173, §1º, CF/88; Lei 8.666/93."
          ], correct: 0 },
        { q: "Quais entes públicos estão subordinados ao regime estabelecido pela Lei n. 8.666/93?",
          options: [
            "Apenas os órgãos da Administração Direta da União.",
            "Órgãos da Administração Direta, fundos especiais, autarquias, fundações públicas e demais entidades controladas direta ou indiretamente.",
            "Somente as autarquias e fundações públicas federais.",
            "Empresas públicas e sociedades de economia mista, exclusivamente."
          ], correct: 1 },
        { q: "Apresente um conceito de licitação segundo a literatura (Meireles, 2008).",
          options: [
            "É o contrato administrativo celebrado após ampla disputa.",
            "É o procedimento administrativo para selecionar a proposta mais vantajosa, com sucessão ordenada de atos vinculantes e igualdade entre licitantes.",
            "É o ato unilateral de escolha do fornecedor pela Administração.",
            "É a fase interna do procedimento de compra pública."
          ], correct: 1 },
        { q: "Quais são os dois objetivos principais do procedimento licitatório?",
          options: [
            "Reduzir despesas e aumentar a arrecadação.",
            "Garantir a isonomia e selecionar a proposta mais vantajosa.",
            "Fiscalizar os licitantes e punir irregularidades.",
            "Cumprir metas orçamentárias e divulgar os vencedores."
          ], correct: 1 },
        { q: "Cite cinco princípios da licitação previstos na Lei n. 8.666/93.",
          options: [
            "Legalidade, impessoalidade, moralidade, publicidade, eficiência.",
            "Legalidade, ampla defesa, contraditório, sigilo, economicidade.",
            "Isonomia, competitividade, razoabilidade, proporcionalidade, celeridade.",
            "Publicidade, vinculação, julgamento subjetivo, informalidade, celeridade."
          ], correct: 0 },
        { q: "O que significa o princípio da isonomia no contexto da licitação?",
          options: [
            "Tratar todos os licitantes de forma absolutamente idêntica, sem qualquer diferenciação.",
            "Permitir a todos os interessados competir em condições de igualdade, equalizando pessoas e tratamentos conforme suas condições.",
            "Beneficiar microempresas e empresas de pequeno porte em todas as licitações.",
            "Exigir que todos os licitantes apresentem as mesmas propostas técnicas."
          ], correct: 1 },
        { q: "Defina obra, serviço e compra conforme a Lei n. 8.666/93.",
          options: [
            "Obra: aquisição de bens; Serviço: construção; Compra: atividade de demolição.",
            "Obra: construção, reforma, fabricação, recuperação ou ampliação; Serviço: atividade destinada a obter utilidade; Compra: aquisição remunerada de bens.",
            "Obra: qualquer serviço de engenharia; Serviço: compra de materiais; Compra: contratação de mão de obra.",
            "Obra: projeto básico; Serviço: projeto executivo; Compra: execução indireta."
          ], correct: 1 },
        { q: "O que é necessário para que uma obra ou serviço seja licitado?",
          options: [
            "Apenas a autorização verbal da autoridade competente.",
            "Projeto básico aprovado, previsão de recursos orçamentários e contemplação nas metas das legislações orçamentárias (PPA, LDO e LOA).",
            "Basta a existência de dotação no orçamento do ano anterior.",
            "Somente a publicação do edital no Diário Oficial."
          ], correct: 1 },
        { q: "Quem está proibido de participar do certame licitatório?",
          options: [
            "Qualquer cidadão maior de 18 anos.",
            "O autor do projeto, a empresa elaboradora do projeto e o servidor ou dirigente do órgão contratante.",
            "Apenas empresas com dívidas fiscais.",
            "Todos os fornecedores que já contrataram com a Administração."
          ], correct: 1 },
        { q: "Como é composta a Comissão de Licitação e qual a responsabilidade de seus membros?",
          options: [
            "Dois membros, sem responsabilidade solidária.",
            "No mínimo três membros, sendo pelo menos dois servidores estáveis; respondem solidariamente pelos atos.",
            "Um servidor efetivo e dois cidadãos comuns, sem responsabilidade.",
            "Cinco membros, todos comissionados, sem estabilidade."
          ], correct: 1 },
        { q: "O que é a \"isonomia do conhecimento\" no procedimento licitatório?",
          options: [
            "Período entre a publicação do aviso e a abertura das propostas, para conhecimento das regras do edital.",
            "Fase de julgamento em que todos os licitantes têm acesso às propostas dos concorrentes.",
            "Divulgação dos nomes dos vencedores antes da homologação.",
            "Garantia de que todos os licitantes terão acesso ao projeto básico após a entrega das propostas."
          ], correct: 0 },
        { q: "Quais são os prazos mínimos entre a publicação do aviso e a abertura das propostas para concorrência (empreitada integral), tomada de preços (demais casos) e convite?",
          options: [
            "30 dias, 15 dias e 5 dias úteis, respectivamente.",
            "45 dias, 30 dias e 5 dias úteis.",
            "45 dias, 15 dias e 5 dias úteis.",
            "30 dias, 30 dias e 10 dias úteis."
          ], correct: 2 },
        { q: "Quais são as modalidades de licitação previstas na Lei n. 8.666/93?",
          options: [
            "Pregão, concorrência, tomada de preços, convite, concurso e leilão.",
            "Concorrência, tomada de preços, convite, concurso e leilão.",
            "Concorrência, pregão, convite, concurso e leilão.",
            "Tomada de preços, convite, pregão eletrônico, concurso e leilão."
          ], correct: 1 },
        { q: "Defina a modalidade concorrência.",
          options: [
            "Licitação entre quaisquer interessados que comprovem requisitos mínimos de qualificação na fase de habilitação preliminar.",
            "Licitação entre interessados cadastrados ou que atendam às condições até o terceiro dia anterior.",
            "Licitação entre convidados em número mínimo de três.",
            "Licitação para escolha de trabalho técnico, científico ou artístico."
          ], correct: 0 },
        { q: "Defina a modalidade tomada de preços.",
          options: [
            "Entre quaisquer interessados, com habilitação preliminar.",
            "Entre interessados devidamente cadastrados ou que atendam às condições até o terceiro dia anterior ao recebimento das propostas.",
            "Entre convidados em número mínimo de três.",
            "Para venda de bens móveis inservíveis."
          ], correct: 1 },
        { q: "Defina a modalidade convite.",
          options: [
            "Entre quaisquer interessados, com ampla publicidade.",
            "Entre interessados do ramo, cadastrados ou não, escolhidos e convidados em número mínimo de três.",
            "Entre interessados cadastrados no SICAF, exclusivamente.",
            "Para alienação de bens imóveis."
          ], correct: 1 },
        { q: "Defina a modalidade concurso.",
          options: [
            "Para escolha de trabalho técnico, científico ou artístico, mediante prêmios ou remuneração.",
            "Para aquisição de bens comuns.",
            "Para alienação de bens móveis inservíveis.",
            "Para contratação de obras de grande vulto."
          ], correct: 0 },
        { q: "Defina a modalidade leilão.",
          options: [
            "Para compra de materiais exclusivos.",
            "Para venda de bens móveis inservíveis, produtos apreendidos ou penhorados, e alienação de imóveis ao maior lance.",
            "Para seleção de projetos culturais.",
            "Para contratação de serviços técnicos especializados."
          ], correct: 1 },
        { q: "O que é a contratação direta e quais são suas duas principais formas?",
          options: [
            "Procedimento que não contempla licitação; dispensa e inexigibilidade.",
            "Licitação realizada em caráter emergencial; dispensa e inexigibilidade.",
            "Contrato verbal com fornecedor; dispensa e inexigibilidade.",
            "Dispensa de licitação apenas; inexigibilidade não existe."
          ], correct: 0 },
        { q: "Qual a diferença entre dispensa e inexigibilidade de licitação?",
          options: [
            "Na dispensa há possibilidade de competição, mas a lei faculta a dispensa; na inexigibilidade não há possibilidade de competição.",
            "Na dispensa não há competição; na inexigibilidade sempre há competição.",
            "Ambas são sinônimos legais.",
            "A dispensa depende de autorização judicial; a inexigibilidade é automática."
          ], correct: 0 },
        { q: "Cite três hipóteses de dispensa de licitação em razão de situações excepcionais.",
          options: [
            "Guerra, emergência ou calamidade pública, licitação deserta.",
            "Guerra, compra de material de escritório, licitação fracassada.",
            "Emergência, contratação de artista consagrado, licitação deserta.",
            "Calamidade, serviços técnicos especializados, licitação fracassada."
          ], correct: 0 },
        { q: "O que é uma licitação deserta e como se diferencia de uma fracassada?",
          options: [
            "Deserta: não aparecem interessados; fracassada: aparecem, mas nenhum é habilitado ou classificado.",
            "Deserta: aparecem interessados, mas nenhum classificado; fracassada: não aparecem interessados.",
            "Deserta: todos são habilitados; fracassada: todos são desclassificados.",
            "São expressões sinônimas."
          ], correct: 0 },
        { q: "Cite três hipóteses de inexigibilidade de licitação previstas no artigo 25 da Lei 8.666/93.",
          options: [
            "Fornecedor exclusivo; serviços técnicos especializados com notória especialização; profissional de setor artístico consagrado.",
            "Guerra, emergência e calamidade pública.",
            "Licitação deserta, fracassada e valores abaixo do limite.",
            "Compra de bens comuns, obras de engenharia e serviços de limpeza."
          ], correct: 0 },
        { q: "O que é considerado \"notória especialização\" para fins de inexigibilidade?",
          options: [
            "Qualquer profissional com registro no conselho de classe.",
            "Profissional ou empresa cujo conceito, decorrente de desempenho anterior, estudos, publicações, etc., permita inferir que seu trabalho é essencial e indiscutivelmente o mais adequado.",
            "Empresa com mais de 10 anos de mercado.",
            "Profissional indicado por autoridade política."
          ], correct: 1 },
        { q: "Quais formalidades devem ser observadas na contratação direta por dispensa ou inexigibilidade?",
          options: [
            "Apenas a justificativa do preço.",
            "Caracterização da situação, razão da escolha, justificativa do preço e aprovação dos projetos (se for o caso); publicação em até 5 dias.",
            "Somente a autorização do chefe do executivo.",
            "Publicação do extrato no Diário Oficial em até 30 dias."
          ], correct: 1 },
        { q: "O que é o Edital e qual sua importância?",
          options: [
            "É a peça mais importante do procedimento, com todas as informações relevantes, não podendo surpreender os licitantes.",
            "É o documento que contém apenas o objeto e o prazo de execução.",
            "É o contrato assinado com o vencedor.",
            "É o parecer jurídico que aprova a licitação."
          ], correct: 0 },
        { q: "Quais são os documentos de habilitação que o licitante deve apresentar?",
          options: [
            "Habilitação jurídica, qualificação técnica, qualificação econômico-financeira, regularidade fiscal e cumprimento do art. 7º, XXXIII, CF.",
            "Somente a regularidade fiscal.",
            "Apenas a qualificação técnica.",
            "Comprovante de residência e identidade."
          ], correct: 0 },
        { q: "Quais são os tipos de licitação previstos na Lei n. 8.666/93 para concorrência, tomada de preços e convite?",
          options: [
            "Menor preço, melhor técnica e técnica e preço.",
            "Menor preço, maior lance e melhor técnica.",
            "Melhor técnica, conteúdo artístico e maior retorno econômico.",
            "Menor preço e maior desconto apenas."
          ], correct: 0 },
        { q: "Em que situações os tipos \"melhor técnica\" ou \"técnica e preço\" devem ser utilizados?",
          options: [
            "Exclusivamente para serviços de natureza predominantemente intelectual.",
            "Para compras de bens comuns.",
            "Para obras de grande vulto.",
            "Para alienação de bens imóveis."
          ], correct: 0 },
        { q: "Como é feito o desempate entre duas ou mais propostas?",
          options: [
            "Por sorteio em ato público, observadas as preferências legais (bens nacionais, microempresas etc.).",
            "Sempre pelo maior preço.",
            "Pela ordem de inscrição no edital.",
            "Por decisão exclusiva do pregoeiro."
          ], correct: 0 },
        { q: "O que é a homologação e a adjudicação?",
          options: [

      // ----------------------------------------------------------------
      // ESTADO DA APLICAÇÃO
      // ----------------------------------------------------------------
      let currentIndex = 0;
      let userAnswers = new Array(questions.length).fill(null);
      let confirmed = new Array(questions.length).fill(false);
      let correctCount = 0;
      let wrongCount = 0;

      // elementos DOM
      const questionText = document.getElementById('questionText');
      const optionsContainer = document.getElementById('optionsContainer');
      const feedbackArea = document.getElementById('feedbackArea');
      const feedbackMessage = document.getElementById('feedbackMessage');
      const confirmBtn = document.getElementById('confirmBtn');
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');
      const resetBtn = document.getElementById('resetBtn');
      const counterText = document.getElementById('counterText');
      const progressFill = document.getElementById('progressFill');
      const statsDisplay = document.getElementById('statsDisplay');
      const questionSelector = document.getElementById('questionSelector');

      // ----------------------------------------------------------------
      // SELETOR DE QUESTÕES
      // ----------------------------------------------------------------
      function populateQuestionSelector() {
        questionSelector.innerHTML = '';
        questions.forEach((q, idx) => {
          const option = document.createElement('option');
          option.value = idx;
          let prefix = '';
          if (confirmed[idx]) {
            prefix = userAnswers[idx] === q.correct ? '✅ ' : '❌ ';
          } else if (userAnswers[idx] !== null) {
            prefix = '📝 ';
          }
          option.textContent = `${prefix}Questão ${idx + 1}`;
          if (idx === currentIndex) option.selected = true;
          questionSelector.appendChild(option);
        });
      }

      function goToQuestion(index) {
        if (index >= 0 && index < questions.length) {
          currentIndex = index;
          renderQuestion();
        }
      }

      // ----------------------------------------------------------------
      // RENDERIZAÇÃO
      // ----------------------------------------------------------------
      function renderQuestion() {
        const q = questions[currentIndex];
        questionText.textContent = `${currentIndex + 1}. ${q.q}`;

        optionsContainer.innerHTML = '';

        q.options.forEach((optText, idx) => {
          const label = document.createElement('label');
          label.className = 'option';

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'question';
          radio.value = idx;
          radio.checked = (userAnswers[currentIndex] === idx);
          radio.disabled = confirmed[currentIndex];

          if (confirmed[currentIndex]) {
            if (idx === q.correct) {
              label.classList.add('correct');
            } else if (idx === userAnswers[currentIndex] && idx !== q.correct) {
              label.classList.add('incorrect');
            }
          } else {
            if (userAnswers[currentIndex] === idx) {
              label.classList.add('selected');
            }
          }

          radio.addEventListener('change', () => {
            if (confirmed[currentIndex]) return;
            userAnswers[currentIndex] = idx;
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            label.classList.add('selected');
            confirmBtn.disabled = false;
            feedbackArea.className = 'feedback';
            feedbackMessage.textContent = 'Clique em “Confirmar resposta” para verificar.';
            feedbackArea.querySelector('.feedback-icon').textContent = '📌';
            populateQuestionSelector();
          });

          label.appendChild(radio);
          label.appendChild(document.createTextNode(' ' + optText));
          optionsContainer.appendChild(label);
        });

        confirmBtn.disabled = confirmed[currentIndex] || userAnswers[currentIndex] === null;
        nextBtn.disabled = (currentIndex === questions.length - 1) || !confirmed[currentIndex];
        prevBtn.disabled = currentIndex === 0;

        if (confirmed[currentIndex]) {
          const isCorrect = userAnswers[currentIndex] === q.correct;
          if (isCorrect) {
            feedbackArea.className = 'feedback correct-fb';
            feedbackMessage.textContent = `✅ Resposta correta!`;
            feedbackArea.querySelector('.feedback-icon').textContent = '✅';
          } else {
            feedbackArea.className = 'feedback incorrect-fb';
            const correctLetter = String.fromCharCode(65 + q.correct);
            feedbackMessage.textContent = `❌ Resposta incorreta. A alternativa correta é a letra ${correctLetter}.`;
            feedbackArea.querySelector('.feedback-icon').textContent = '❌';
          }
        } else {
          feedbackArea.className = 'feedback';
          feedbackMessage.textContent = userAnswers[currentIndex] !== null
            ? 'Clique em “Confirmar resposta” para verificar.'
            : 'Escolha uma alternativa e clique em “Confirmar”.';
          feedbackArea.querySelector('.feedback-icon').textContent = '📌';
        }

        counterText.textContent = `Questão ${currentIndex + 1} de ${questions.length}`;
        progressFill.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

        updateStats();
        populateQuestionSelector();
      }

      function updateStats() {
        let acertos = 0, erros = 0;
        for (let i = 0; i < questions.length; i++) {
          if (confirmed[i]) {
            if (userAnswers[i] === questions[i].correct) acertos++;
            else erros++;
          }
        }
        correctCount = acertos;
        wrongCount = erros;
        statsDisplay.textContent = `✅ ${acertos} acertos · ❌ ${erros} erros`;
      }

      // ----------------------------------------------------------------
      // AÇÕES
      // ----------------------------------------------------------------
      function confirmAnswer() {
        if (confirmed[currentIndex]) return;
        if (userAnswers[currentIndex] === null) return;

        confirmed[currentIndex] = true;
        const q = questions[currentIndex];
        const isCorrect = userAnswers[currentIndex] === q.correct;

        const labels = optionsContainer.querySelectorAll('.option');
        labels.forEach((label, idx) => {
          const radio = label.querySelector('input[type="radio"]');
          radio.disabled = true;
          if (idx === q.correct) label.classList.add('correct');
          else if (idx === userAnswers[currentIndex] && !isCorrect) label.classList.add('incorrect');
          label.classList.remove('selected');
        });

        if (isCorrect) {
          feedbackArea.className = 'feedback correct-fb';
          feedbackMessage.textContent = '✅ Resposta correta!';
          feedbackArea.querySelector('.feedback-icon').textContent = '✅';
        } else {
          const correctLetter = String.fromCharCode(65 + q.correct);
          feedbackArea.className = 'feedback incorrect-fb';
          feedbackMessage.textContent = `❌ Resposta incorreta. A alternativa correta é a letra ${correctLetter}.`;
          feedbackArea.querySelector('.feedback-icon').textContent = '❌';
        }

        confirmBtn.disabled = true;
        nextBtn.disabled = (currentIndex === questions.length - 1);
        updateStats();
        populateQuestionSelector();
      }

      function goToNext() {
        if (currentIndex < questions.length - 1) {
          currentIndex++;
          renderQuestion();
        }
      }

      function goToPrev() {
        if (currentIndex > 0) {
          currentIndex--;
          renderQuestion();
        }
      }

      function resetAll() {
        if (!confirm('Tem certeza que deseja reiniciar o banco de questões? Todas as respostas serão apagadas.')) return;
        currentIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        confirmed = new Array(questions.length).fill(false);
        correctCount = 0;
        wrongCount = 0;
        renderQuestion();
      }

      // ----------------------------------------------------------------
      // EVENT LISTENERS
      // ----------------------------------------------------------------
      confirmBtn.addEventListener('click', confirmAnswer);
      nextBtn.addEventListener('click', goToNext);
      prevBtn.addEventListener('click', goToPrev);
      resetBtn.addEventListener('click', resetAll);
      questionSelector.addEventListener('change', (e) => {
        goToQuestion(parseInt(e.target.value, 10));
      });

      // Inicializa
      renderQuestion();
    })();
  </script>
</body>
</html>
